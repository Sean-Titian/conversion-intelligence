[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conversion-intelligence"
version = "0.2.0"
description = "Decision-aware conversion modeling with leakage-aware evaluation and an experimentation handoff."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Zishen Tian" }]
dependencies = [
  "matplotlib>=3.9,<4",
  "numpy>=2.3.2,<2.4",
  "pandas>=2.3.2,<2.4",
  "scikit-learn>=1.7.2,<1.8",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]
spark = [
  "pyspark==4.2.0",
]

[project.scripts]
conversion-train = "conversion_intelligence.train:main"
conversion-synthesize = "conversion_intelligence.synthetic:main"
conversion-audit = "conversion_intelligence.audit:main"
conversion-decide = "conversion_intelligence.decision:main"
conversion-pit-verify = "conversion_intelligence.spark_features:main"

[project.urls]
Repository = "https://github.com/Sean-Titian/conversion-intelligence"
Issues = "https://github.com/Sean-Titian/conversion-intelligence/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
conversion_intelligence = ["sql/*.sql"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
